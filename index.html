<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="addBook">ADD A BOOK</button>
    <dialog>
        <form>
    <div>
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" required>
    </div>

    <div>
        <label for="author">Author:</label>
        <input type="text" id="author" name="author" required>
    </div>

    <div>
        <label for="publisher">Publisher:</label>
        <input type="text" id="publisher" name="publisher">
    </div>

    <div>
        <label for="pagecount">Page Count:</label>
        <input type="number" id="pagecount" name="pagecount" min="1">
    </div>

    <div>
        <label for="genre">Genre:</label>
        <input type="text" id="genre" name="genre">
    </div>

    <div>
        <button id="close" type="submit">Submit</button>
    </div>
</form>
    </dialog>

    <div class="boxContainer" id="container">
    </div>
    <div class="test" data-uuid="ABRACADABRA"></div>
    <script src="script.js"></script>
</body>
</html>
